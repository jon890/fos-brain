services:
  brain-web:
    image: ${NGINX_IMAGE:?Set NGINX_IMAGE in deploy/home-server/.env}
    restart: unless-stopped
    volumes:
      - type: bind
        source: ${PROTECTED_OUTPUT_ROOT:?Set PROTECTED_OUTPUT_ROOT in deploy/home-server/.env}
        target: /usr/share/nginx/html
        read_only: true
      - type: bind
        source: ${BRAIN_DEPLOY_ROOT:?Set BRAIN_DEPLOY_ROOT in deploy/home-server/.env}/nginx.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
    networks:
      - public-net

  cloudflared:
    image: ${CLOUDFLARED_IMAGE:?Set CLOUDFLARED_IMAGE in deploy/home-server/.env}
    restart: unless-stopped
    command:
      - tunnel
      - --no-autoupdate
      - run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?Set TUNNEL_TOKEN in deploy/home-server/.env}
    networks:
      - public-net

networks:
  public-net:
    name: public-net
    external: true
