name: Brain Ask image 발행

on:
  push:
    branches:
      - main
    paths:
      - services/brain-ask/**

permissions: {}

jobs:
  publish:
    if: github.repository == 'jon890/fos-brain'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/jon890/brain-ask

    steps:
      - name: Buildx 준비
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: GHCR 로그인
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: image 빌드와 발행
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          file: ./services/brain-ask/Dockerfile
          platforms: linux/amd64
          push: true
          github-token: ''
          tags: ghcr.io/jon890/brain-ask:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: immutable image 검증과 기록
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker buildx imagetools inspect "$IMAGE@$DIGEST"
          {
            echo '### Brain Ask image'
            echo
            echo "- image@digest: \`$IMAGE@$DIGEST\`"
            echo "- source commit: \`$GITHUB_SHA\`"
            echo "- workflow URL: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } >> "$GITHUB_STEP_SUMMARY"
