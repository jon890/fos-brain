<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>fos-brain · 큐레이션 미리보기</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&family=Source+Sans+3:wght@400;600&family=IBM+Plex+Mono&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  :root {
    --light: #faf8f8;
    --lightgray: #e5e5e5;
    --gray: #b8b8b8;
    --darkgray: #4e4e4e;
    --dark: #2b2b2b;
    --secondary: #284b63;
    --tertiary: #84a59d;
    --highlight: rgba(143, 159, 169, 0.15);
    --new: #2f855a;
    --augment: #b7791f;
    --drop: #9b9b9b;
    --warning: #c05621;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--light);
    color: var(--dark);
    font-family: "Source Sans 3", -apple-system, sans-serif;
    line-height: 1.6;
    font-size: 16px;
  }
  .wrap { max-width: 820px; margin: 0 auto; padding: 2.5rem 1.5rem 5rem; }
  h1, h2, h3, h4 { font-family: "Schibsted Grotesk", sans-serif; color: var(--dark); line-height: 1.3; }
  .masthead { border-bottom: 1px solid var(--lightgray); padding-bottom: 1rem; margin-bottom: 2rem; }
  .masthead .brand { font-family: "Schibsted Grotesk"; font-weight: 700; font-size: 1.05rem; color: var(--secondary); letter-spacing: -0.01em; }
  .masthead .sub { color: var(--darkgray); font-size: 0.9rem; margin-top: 0.2rem; }
  code, pre, .mono { font-family: "IBM Plex Mono", monospace; font-size: 0.86em; }
  a, .wikilink { color: var(--secondary); text-decoration: none; border-bottom: 1px solid var(--tertiary); }
  /* 네임스페이스·상태 뱃지 */
  .badge { display: inline-block; font-size: 0.72rem; font-weight: 600; padding: 0.1rem 0.5rem; border-radius: 999px; font-family: "Schibsted Grotesk"; vertical-align: middle; }
  .b-public { background: rgba(47,133,90,0.12); color: var(--new); }
  .b-route { background: rgba(192,86,33,0.12); color: var(--warning); }
  .b-private { background: rgba(120,120,120,0.15); color: #555; }
  .b-admit { background: rgba(47,133,90,0.12); color: var(--new); }
  .b-reinforce { background: rgba(183,121,31,0.14); color: var(--augment); }
  .b-reject { background: rgba(150,150,150,0.15); color: var(--drop); }
  /* 통계 카드 */
  .stats { display: flex; gap: 0.75rem; flex-wrap: wrap; margin: 1.5rem 0; }
  .stat { flex: 1; min-width: 110px; background: #fff; border: 1px solid var(--lightgray); border-radius: 10px; padding: 0.9rem 1rem; }
  .stat .n { font-family: "Schibsted Grotesk"; font-weight: 700; font-size: 1.7rem; line-height: 1; }
  .stat .l { color: var(--darkgray); font-size: 0.8rem; margin-top: 0.35rem; }
  .stat.new .n { color: var(--new); }
  .stat.augment .n { color: var(--augment); }
  .stat.drop .n { color: var(--drop); }
  /* 후보 표 */
  table { width: 100%; border-collapse: collapse; margin: 1rem 0 2rem; font-size: 0.92rem; }
  th { text-align: left; font-family: "Schibsted Grotesk"; font-weight: 600; color: var(--darkgray); border-bottom: 2px solid var(--lightgray); padding: 0.5rem 0.6rem; font-size: 0.82rem; }
  td { border-bottom: 1px solid var(--lightgray); padding: 0.55rem 0.6rem; vertical-align: top; }
  tr:hover td { background: var(--highlight); }
  .num { color: var(--gray); font-family: "IBM Plex Mono"; font-size: 0.8rem; }
  /* 섹션 제목 */
  .section-title { font-size: 1.35rem; margin: 2.5rem 0 0.3rem; }
  .section-hint { color: var(--darkgray); font-size: 0.9rem; margin: 0 0 0.8rem; }
  /* wiki 페이지 미리보기 카드 */
  .page { background: #fff; border: 1px solid var(--lightgray); border-left: 4px solid var(--tertiary); border-radius: 10px; padding: 1.4rem 1.6rem; margin: 1.2rem 0; }
  .page .fm { font-family: "IBM Plex Mono"; font-size: 0.74rem; color: var(--gray); margin-bottom: 0.6rem; }
  .page h1:first-child, .page h2:first-child { margin-top: 0; }
  .page h1 { font-size: 1.4rem; }
  .page h2 { font-size: 1.05rem; border-bottom: 1px solid var(--lightgray); padding-bottom: 0.2rem; margin-top: 1.3rem; }
  .page ul { padding-left: 1.2rem; }
  .page li { margin: 0.2rem 0; color: var(--darkgray); }
  .page p { color: var(--darkgray); }
  blockquote { border-left: 3px solid var(--gray); margin: 0.8rem 0; padding: 0.2rem 0 0.2rem 1rem; color: var(--darkgray); background: var(--highlight); }
  .flag { color: var(--warning); font-weight: 600; }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const DATA = __DATA__;

function destinationBadge(destination) {
  const map = { public: "b-public", private: "b-private" };
  return `<span class="badge ${map[destination] || "b-route"}">${destination}</span>`;
}
function decisionBadge(decision) {
  const map = { admit: "b-admit", reinforce: "b-reinforce", route: "b-route", reject: "b-reject" };
  return `<span class="badge ${map[decision] || "b-reject"}">${decision}</span>`;
}

const d = DATA;
let html = "";
html += `<div class="masthead">
  <div class="brand">fos-brain · 큐레이션 미리보기</div>
  <div class="sub">${d.title}</div>
</div>`;

// 통계 카드
if (d.stats) {
  html += `<div class="stats">`;
  for (const [label, info] of Object.entries(d.stats)) {
    html += `<div class="stat ${info.kind || ""}"><div class="n">${info.n}</div><div class="l">${label}</div></div>`;
  }
  html += `</div>`;
}

// 후보 표
if (d.candidates && d.candidates.length) {
  html += `<div class="section-title">후보 목록</div>
    <div class="section-hint">등록할 항목을 검토하세요. 표는 채팅 본문과 동일합니다.</div>`;
  html += `<table><thead><tr><th>#</th><th>후보</th><th>판정</th><th>가치 축</th><th>목적지</th><th>근거와 이유</th></tr></thead><tbody>`;
  for (const [index, c] of d.candidates.entries()) {
    html += `<tr>
      <td class="num">${index + 1}</td>
      <td>${c.candidate}</td>
      <td>${decisionBadge(c.decision)}</td>
      <td class="mono">${(c.value_axes || []).join(", ")}</td>
      <td>${destinationBadge(c.destination)}</td>
      <td style="color:var(--darkgray);font-size:0.85rem">${(c.evidence || []).join("<br>")}<br>${c.reason || ""}</td>
    </tr>`;
  }
  html += `</tbody></table>`;
}

// wiki 페이지 본문 미리보기
if (d.pages && d.pages.length) {
  html += `<div class="section-title">wiki 페이지 미리보기</div>
    <div class="section-hint">등록되면 이 모습으로 컴파일됩니다 (Quartz 렌더 근사).</div>`;
  for (const p of d.pages) {
    html += `<div class="page">`;
    if (p.frontmatter) html += `<div class="fm">${p.frontmatter}</div>`;
    html += marked.parse(p.markdown);
    html += `</div>`;
  }
}

document.getElementById("app").innerHTML = html;
</script>
</body>
</html>
