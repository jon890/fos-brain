<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="dark" />
<title>fos-brain · 지식 승인 항해도</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  :root {
    --atlas-void: #020608;
    --atlas-trench: rgba(7, 23, 29, 0.78);
    --atlas-panel: rgba(8, 20, 22, 0.7);
    --atlas-line: rgba(154, 201, 186, 0.14);
    --atlas-line-strong: rgba(154, 201, 186, 0.3);
    --atlas-mint: #9ac9ba;
    --atlas-current: #5cc8b2;
    --atlas-clay: #d4875e;
    --atlas-ember: #e99368;
    --atlas-paper: #ece3cf;
    --atlas-text: #bdc9c5;
    --atlas-muted: rgba(236, 227, 207, 0.64);
    --atlas-sounding: #6e8790;
    --atlas-focus: #f1c97a;
  }

  * { box-sizing: border-box; }
  html { background: var(--atlas-void); }
  body {
    margin: 0;
    min-height: 100vh;
    color: var(--atlas-text);
    background:
      radial-gradient(circle at 78% 10%, rgba(154, 201, 186, 0.12), transparent 30rem),
      radial-gradient(circle at 28% 72%, rgba(212, 135, 94, 0.08), transparent 26rem),
      linear-gradient(135deg, #020608, #071416 58%, #030606);
    font-family: "IBM Plex Sans KR", -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 16px;
    line-height: 1.68;
    overflow-wrap: anywhere;
  }
  body::before {
    position: fixed;
    inset: 0;
    z-index: -1;
    content: "";
    opacity: 0.38;
    background-image:
      radial-gradient(circle, rgba(232, 227, 212, 0.42) 0 0.65px, transparent 0.8px),
      radial-gradient(circle, rgba(92, 200, 178, 0.3) 0 0.55px, transparent 0.72px);
    background-position: 0 0, 19px 27px;
    background-size: 43px 47px, 71px 67px;
    pointer-events: none;
  }

  a, button, summary { color: inherit; }
  a:focus-visible, button:focus-visible, summary:focus-visible {
    outline: 3px solid var(--atlas-focus);
    outline-offset: 3px;
  }
  h1, h2, h3, h4 {
    color: var(--atlas-paper);
    font-family: "Gowun Batang", serif;
    line-height: 1.28;
    overflow-wrap: anywhere;
  }
  code, pre, .mono {
    font-family: "IBM Plex Mono", monospace;
  }

  .atlas-nav {
    position: fixed;
    inset: 0 0 auto;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    min-height: 58px;
    padding: 0 max(1rem, env(safe-area-inset-right)) 0 max(1rem, env(safe-area-inset-left));
    border-bottom: 1px solid rgba(154, 201, 186, 0.1);
    background: rgba(2, 6, 8, 0.78);
    backdrop-filter: blur(16px) saturate(1.05);
  }
  .atlas-nav__brand {
    color: var(--atlas-muted);
    font: 500 0.7rem/1.3 "IBM Plex Mono", monospace;
    letter-spacing: 0.04em;
  }
  .atlas-nav__return {
    display: inline-flex;
    align-items: center;
    min-height: 36px;
    padding: 0.4rem 0.68rem;
    border: 1px solid rgba(154, 201, 186, 0.34);
    border-radius: 999px;
    color: var(--atlas-paper);
    background: rgba(154, 201, 186, 0.12);
    font-size: 0.8rem;
  }

  .atlas-shell {
    display: grid;
    grid-template-columns: minmax(190px, 230px) minmax(0, 820px);
    gap: clamp(1.5rem, 4vw, 4rem);
    width: min(1180px, calc(100% - 2rem));
    margin: 0 auto;
    padding: 6.5rem 0 5rem;
  }

  .atlas-rail {
    position: sticky;
    top: 5rem;
    align-self: start;
    display: grid;
    gap: 0.85rem;
    max-height: calc(100vh - 6rem);
    padding: 1rem;
    overflow: auto;
    border: 1px solid var(--atlas-line);
    border-radius: 10px;
    background: linear-gradient(180deg, rgba(7, 23, 29, 0.72), rgba(2, 8, 10, 0.42));
    box-shadow: 0 18px 58px rgba(0, 0, 0, 0.26);
    backdrop-filter: blur(10px);
  }
  .atlas-rail__eyebrow {
    margin: 0;
    color: var(--atlas-mint);
    font: 500 0.68rem/1.4 "IBM Plex Mono", monospace;
    letter-spacing: 0.06em;
  }
  .atlas-rail h1 {
    margin: 0.1rem 0 0;
    font-size: 1.2rem;
  }
  .atlas-rail__note {
    margin: 0;
    color: var(--atlas-muted);
    font-size: 0.78rem;
  }
  .stats {
    display: grid;
    gap: 0;
    border-block: 1px solid rgba(154, 201, 186, 0.08);
  }
  .stat {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 0.75rem;
    padding: 0.48rem 0;
    border-bottom: 1px solid rgba(154, 201, 186, 0.05);
  }
  .stat:last-child { border-bottom: 0; }
  .stat__label { color: var(--atlas-muted); font-size: 0.74rem; }
  .stat__number { color: var(--atlas-current); font: 600 0.94rem/1 "IBM Plex Mono", monospace; }
  .atlas-rail__legend {
    display: grid;
    gap: 0.4rem;
    margin: 0;
    padding: 0;
    list-style: none;
    color: var(--atlas-muted);
    font-size: 0.74rem;
  }
  .atlas-rail__legend li { display: flex; align-items: center; gap: 0.45rem; }
  .atlas-rail__legend i {
    width: 0.55rem;
    height: 0.55rem;
    border-radius: 999px;
    background: var(--atlas-mint);
    box-shadow: 0 0 14px rgba(154, 201, 186, 0.38);
  }
  .atlas-rail__legend li:nth-child(2) i { background: var(--atlas-clay); }
  .atlas-rail__legend li:nth-child(3) i { background: var(--atlas-sounding); }

  .atlas-main { min-width: 0; }
  .hero {
    padding-bottom: 1.6rem;
    border-bottom: 1px solid var(--atlas-line);
  }
  .hero__kicker {
    margin: 0 0 0.5rem;
    color: var(--atlas-current);
    font: 500 0.72rem/1.4 "IBM Plex Mono", monospace;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }
  .hero h2 {
    max-width: 18ch;
    margin: 0;
    font-size: clamp(2rem, 5vw, 3.8rem);
    letter-spacing: -0.03em;
  }
  .hero__summary {
    max-width: 64ch;
    margin: 1rem 0 0;
    color: var(--atlas-muted);
  }

  .section-title {
    margin: 2.8rem 0 0.4rem;
    font-size: clamp(1.35rem, 2vw, 1.7rem);
  }
  .section-hint {
    max-width: 68ch;
    margin: 0 0 1rem;
    color: var(--atlas-muted);
    font-size: 0.88rem;
  }

  .candidate-list { display: grid; gap: 0.7rem; }
  .candidate {
    position: relative;
    display: grid;
    gap: 0.75rem;
    min-width: 0;
    padding: 1rem 1.05rem 1rem 1.25rem;
    overflow: hidden;
    border: 1px solid var(--atlas-line);
    border-radius: 9px;
    background: rgba(8, 20, 22, 0.46);
    box-shadow: 0 12px 38px rgba(0, 0, 0, 0.16);
  }
  .candidate::before {
    position: absolute;
    inset: 0 auto 0 0;
    width: 3px;
    content: "";
    background: var(--decision-color, var(--atlas-sounding));
    box-shadow: 0 0 18px var(--decision-color, var(--atlas-sounding));
  }
  .candidate[data-decision="admit"] { --decision-color: var(--atlas-current); }
  .candidate[data-decision="reinforce"] { --decision-color: var(--atlas-mint); }
  .candidate[data-decision="route"] { --decision-color: var(--atlas-clay); }
  .candidate[data-decision="reject"] { --decision-color: var(--atlas-sounding); }
  .candidate__head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 1rem;
    min-width: 0;
  }
  .candidate__number {
    color: var(--atlas-sounding);
    font: 500 0.7rem/1.4 "IBM Plex Mono", monospace;
  }
  .candidate h3 {
    margin: 0.15rem 0 0;
    font-size: 1.08rem;
  }
  .candidate__badges { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 0.35rem; }
  .badge {
    display: inline-flex;
    align-items: center;
    min-height: 26px;
    max-width: 100%;
    padding: 0.16rem 0.52rem;
    border: 1px solid var(--atlas-line-strong);
    border-radius: 999px;
    color: var(--atlas-muted);
    background: rgba(154, 201, 186, 0.08);
    font: 500 0.68rem/1.2 "IBM Plex Mono", monospace;
    overflow-wrap: anywhere;
  }
  .badge--admit, .badge--public { color: var(--atlas-current); }
  .badge--reinforce { color: var(--atlas-mint); }
  .badge--route { color: var(--atlas-clay); }
  .badge--reject, .badge--private { color: var(--atlas-muted); }
  .candidate__question, .candidate__reason { margin: 0; }
  .candidate__question { color: var(--atlas-paper); }
  .candidate__reason { color: var(--atlas-text); font-size: 0.9rem; }
  .candidate__axes { display: flex; flex-wrap: wrap; gap: 0.35rem; }
  .candidate details { min-width: 0; color: var(--atlas-muted); font-size: 0.78rem; }
  .candidate summary { cursor: pointer; }
  .candidate ul { margin: 0.45rem 0 0; padding-left: 1.1rem; }
  .candidate li { overflow-wrap: anywhere; }

  .wiki-pages { display: grid; gap: 1.4rem; }
  .wiki-page {
    min-width: 0;
    overflow: hidden;
    border: 1px solid var(--atlas-line);
    border-radius: 10px;
    background: rgba(5, 9, 10, 0.72);
    box-shadow: 0 18px 52px rgba(0, 0, 0, 0.2);
  }
  .wiki-page__nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    min-height: 50px;
    padding: 0.55rem 0.8rem;
    border-bottom: 1px solid rgba(154, 201, 186, 0.1);
    background: rgba(2, 6, 8, 0.72);
  }
  .wiki-page__return { color: var(--atlas-mint); font-size: 0.76rem; }
  .wiki-page__frontmatter {
    color: var(--atlas-muted);
    font: 400 0.66rem/1.5 "IBM Plex Mono", monospace;
    text-align: right;
    overflow-wrap: anywhere;
  }
  .wiki-page__body {
    min-width: 0;
    padding: clamp(1.15rem, 3vw, 2rem);
    color: var(--atlas-text);
    line-height: 1.78;
  }
  .wiki-page__body > :first-child { margin-top: 0; }
  .wiki-page__body h1 { font-size: clamp(1.55rem, 4vw, 2.25rem); }
  .wiki-page__body h2 {
    margin-top: 1.8rem;
    padding-bottom: 0.3rem;
    border-bottom: 1px solid var(--atlas-line);
    font-size: 1.2rem;
  }
  .wiki-page__body h3 { font-size: 1.02rem; }
  .wiki-page__body a { color: var(--atlas-mint); }
  .wiki-page__body .wikilink {
    display: inline-flex;
    align-items: center;
    max-width: 100%;
    padding: 0.04rem 0.38rem;
    border: 1px solid rgba(154, 201, 186, 0.28);
    border-radius: 999px;
    color: var(--atlas-mint);
    background: rgba(154, 201, 186, 0.08);
    font: 500 0.78rem/1.45 "IBM Plex Mono", monospace;
    overflow-wrap: anywhere;
  }
  .wiki-page__body .wikilink::before {
    width: 0.34rem;
    height: 0.34rem;
    margin-right: 0.32rem;
    border-radius: 999px;
    background: var(--atlas-current);
    box-shadow: 0 0 10px rgba(92, 200, 178, 0.52);
    content: "";
  }
  .wiki-page__body .wikilink--missing {
    border-color: rgba(212, 135, 94, 0.42);
    color: var(--atlas-clay);
    background: rgba(212, 135, 94, 0.08);
  }
  .wiki-page__body .wikilink--missing::before {
    background: var(--atlas-clay);
    box-shadow: 0 0 10px rgba(212, 135, 94, 0.5);
  }
  .wiki-page__body strong { color: var(--atlas-paper); }
  .wiki-page__body blockquote {
    margin-inline: 0;
    padding: 0.2rem 0 0.2rem 1rem;
    border-left: 3px solid var(--atlas-clay);
    color: var(--atlas-muted);
  }
  .wiki-page__body pre {
    max-width: 100%;
    padding: 0.85rem;
    overflow: auto;
    border: 1px solid var(--atlas-line);
    border-radius: 7px;
    background: rgba(236, 227, 207, 0.06);
  }
  .wiki-page__body code {
    color: var(--atlas-paper);
    background: rgba(236, 227, 207, 0.07);
  }
  .wiki-page__body table {
    display: block;
    width: 100%;
    max-width: 100%;
    overflow-x: auto;
    border-collapse: collapse;
  }
  .wiki-page__body th, .wiki-page__body td {
    min-width: 8rem;
    padding: 0.45rem 0.55rem;
    border: 1px solid var(--atlas-line);
    text-align: left;
  }
  .wiki-page__body img { max-width: 100%; height: auto; }

  @media (max-width: 800px) {
    .atlas-nav__brand { max-width: 50vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .atlas-shell {
      grid-template-columns: minmax(0, 1fr);
      width: min(100% - 1.25rem, 820px);
      padding-top: 5rem;
    }
    .atlas-rail {
      position: static;
      grid-template-columns: minmax(0, 1fr);
      max-height: none;
      padding: 0.85rem;
    }
    .atlas-rail__legend { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .hero h2 { max-width: none; }
    .candidate__head { display: grid; gap: 0.65rem; }
    .candidate__badges { justify-content: flex-start; }
    .wiki-page__nav { align-items: flex-start; flex-direction: column; gap: 0.2rem; }
    .wiki-page__frontmatter { text-align: left; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { scroll-behavior: auto !important; }
  }
</style>
</head>
<body data-preview-contract="memory-atlas-doc-v1">
<nav class="atlas-nav" aria-label="미리보기 내비게이션">
  <span class="atlas-nav__brand" id="nav-brand">FOS / MEMORY · CURATION</span>
  <span class="atlas-nav__return">← 기억의 항해도</span>
</nav>
<div class="atlas-shell" id="app"></div>
<script>
const DATA = __DATA__;
const COPY = DATA.copy || {};
const knownSlugs = new Set([
  ...(DATA.knownSlugs || []),
  ...(DATA.pages || []).map((page) => page.slug).filter(Boolean),
]);

const DECISION_LABELS = {
  admit: "신규 저장",
  reinforce: "기존 보강",
  route: "다른 원본",
  reject: "저장 제외",
};

function escapeHtml(value) {
  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function badge(value, kind = "") {
  return `<span class="badge badge--${escapeHtml(kind || value)}">${escapeHtml(value)}</span>`;
}

function renderStats(stats) {
  if (!stats) return "";
  return `<div class="stats">${Object.entries(stats).map(([label, info]) => `
    <div class="stat">
      <span class="stat__label">${escapeHtml(label)}</span>
      <strong class="stat__number">${escapeHtml(info.n)}</strong>
    </div>`).join("")}</div>`;
}

function renderCandidate(candidate, index) {
  const decision = candidate.decision || "reject";
  const axes = (candidate.value_axes || []).map((axis) => badge(axis)).join("");
  const evidence = (candidate.evidence || []).map((item) => `<li>${escapeHtml(item)}</li>`).join("");
  return `<article class="candidate" data-decision="${escapeHtml(decision)}">
    <div class="candidate__head">
      <div>
        <span class="candidate__number">MEMORY ${String(index + 1).padStart(2, "0")}</span>
        <h3>${escapeHtml(candidate.candidate)}</h3>
      </div>
      <div class="candidate__badges">
        ${badge(DECISION_LABELS[decision] || decision, decision)}
        ${badge(candidate.destination || "none", candidate.destination || "none")}
      </div>
    </div>
    ${candidate.future_question ? `<p class="candidate__question">${escapeHtml(candidate.future_question)}</p>` : ""}
    <p class="candidate__reason">${escapeHtml(candidate.reason || "")}</p>
    ${axes ? `<div class="candidate__axes">${axes}</div>` : ""}
    ${evidence ? `<details><summary>근거 ${candidate.evidence.length}건</summary><ul>${evidence}</ul></details>` : ""}
  </article>`;
}

function renderWikilinks(markdown) {
  return String(markdown || "").replace(/\[\[([^\]]+)\]\]/g, (_, reference) => {
    const [target, label] = reference.split("|", 2);
    if (target.startsWith("../") || target.startsWith("./")) {
      return `<code>${escapeHtml(reference)}</code>`;
    }
    const slug = target.split("#", 1)[0].split("/").pop().replace(/\.md$/, "");
    const missing = knownSlugs.size > 0 && !knownSlugs.has(slug);
    const className = missing ? "wikilink wikilink--missing" : "wikilink";
    return `<span class="${className}" title="${escapeHtml(target)}">${escapeHtml(label || slug)}</span>`;
  });
}

function renderPage(page) {
  return `<article class="wiki-page" data-page-status="${escapeHtml(page.status || "preview")}">
    <div class="wiki-page__nav">
      <span class="wiki-page__return">← 기억의 항해도로 돌아가기</span>
      ${page.frontmatter ? `<span class="wiki-page__frontmatter">${escapeHtml(page.frontmatter)}</span>` : ""}
    </div>
    <div class="wiki-page__body">${marked.parse(renderWikilinks(page.markdown))}</div>
  </article>`;
}

const candidates = DATA.candidates || [];
const pages = DATA.pages || [];
document.getElementById("nav-brand").textContent = COPY.navBrand || "FOS / MEMORY · CURATION";
document.getElementById("app").innerHTML = `
  <aside class="atlas-rail" aria-label="판정 요약">
    <div>
      <p class="atlas-rail__eyebrow">FOS / MEMORY</p>
      <h1>${escapeHtml(COPY.railTitle || "지식 승인 항해도")}</h1>
    </div>
    <p class="atlas-rail__note">${escapeHtml(COPY.railNote || "저장 전 후보와 문서 모습을 함께 확인합니다.")}</p>
    ${renderStats(DATA.stats)}
    <ul class="atlas-rail__legend">
      <li><i></i> 새 기억</li>
      <li><i></i> 다른 원본</li>
      <li><i></i> 저장 제외</li>
    </ul>
  </aside>
  <main class="atlas-main">
    <header class="hero">
      <p class="hero__kicker">${escapeHtml(COPY.heroKicker || "CURATION / BEFORE WRITE")}</p>
      <h2>${escapeHtml(DATA.title || "지식 큐레이션")}</h2>
      <p class="hero__summary">${escapeHtml(COPY.heroSummary || DATA.summary || "현재 Memory Atlas 문서 화면의 색, 글꼴과 읽기 폭을 반영한 승인용 근사 화면입니다. 3D 상호작용은 포함하지 않습니다.")}</p>
    </header>
    ${candidates.length ? `
      <section aria-labelledby="candidate-title">
        <h2 class="section-title" id="candidate-title">지식 후보</h2>
        <p class="section-hint">판정, 목적지와 근거를 확인합니다. 승인 전에는 brain을 변경하지 않습니다.</p>
        <div class="candidate-list">${candidates.map(renderCandidate).join("")}</div>
      </section>` : ""}
    ${pages.length ? `
      <section aria-labelledby="page-title">
        <h2 class="section-title" id="page-title">wiki 문서 미리보기</h2>
        <p class="section-hint">${escapeHtml(COPY.pageHint || "현재 원문 화면과 같은 시각 언어로 본문을 읽습니다. 실제 링크와 3D 상태 복원은 등록 후 Quartz에서 검증합니다.")}</p>
        <div class="wiki-pages">${pages.map(renderPage).join("")}</div>
      </section>` : ""}
  </main>`;
</script>
</body>
</html>
